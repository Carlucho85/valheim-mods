name: Validate modpack and launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test client pack builder
        run: python -m unittest discover -s tests -v
      - name: Build launcher
        run: dotnet build .\launcher\AkaiHoshiLauncher\AkaiHoshiLauncher.csproj --configuration Release
