name: Publish Windows launcher asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained Windows launcher
        run: >-
          dotnet publish .\launcher\AkaiHoshiLauncher\AkaiHoshiLauncher.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output .\publish -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
      - name: Attach launcher to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" .\publish\AkaiHoshiLauncher.exe --repo "$env:GITHUB_REPOSITORY" --clobber
        shell: pwsh
